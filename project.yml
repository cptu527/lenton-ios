name: LentonIOS
options:
  bundleIdPrefix: com.mastoflow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: "201"
    MARKETING_VERSION: "0.25.17"
targets:
  LentonIOS:
    type: application
    platform: iOS
    sources:
      - path: LentonIOS
    info:
      path: LentonIOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mastoflow.lenton
        PRODUCT_NAME: "렌톤"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
schemes:
  LentonIOS:
    build:
      targets:
        LentonIOS: all
    run:
      config: Debug
    archive:
      config: Release
