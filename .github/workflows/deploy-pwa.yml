name: Deploy Lenton PWA

on:
  push:
    branches: [ main, pwa/exact-android-v02517 ]
    paths:
      - 'PWA/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lenton-pwa-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check PWA/app.js
          node --check PWA/sw.js

      - name: Extract launcher from published Android APK
        run: |
          rm -rf dist-pwa
          cp -R PWA dist-pwa
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          import zipfile

          apk = Path("/tmp/Lenton-v0.25.17-test.apk")
          urlretrieve(
              "https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.25.17-test.apk",
              apk,
          )
          print("APK bytes:", apk.stat().st_size)

          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              images = [
                  n for n in names
                  if ("launcher" in n.lower() or "mipmap" in n.lower()
                      or n.lower().endswith(".png") or n.lower().endswith(".webp"))
              ]
              print("Packaged image/resource candidates:")
              for n in images[:300]:
                  print(n)

              launchers = [n for n in names if n.lower().endswith("/ic_launcher.png")]
              if not launchers:
                  launchers = [n for n in names if n.lower().endswith("/ic_launcher_foreground.png")]
              if not launchers:
                  raise SystemExit("No named launcher image found in APK")

              def rank(name):
                  low = name.lower()
                  if "xxxhdpi" in low: return 5
                  if "xxhdpi" in low: return 4
                  if "xhdpi" in low: return 3
                  if "hdpi" in low: return 2
                  if "mdpi" in low: return 1
                  return 0

              launcher = sorted(launchers, key=rank)[-1]
              print("Using Android launcher:", launcher)
              Path("/tmp/lenton-android-launcher.png").write_bytes(z.read(launcher))
          PY

          test -s /tmp/lenton-android-launcher.png
          cp /tmp/lenton-android-launcher.png dist-pwa/icon-192.png
          cp /tmp/lenton-android-launcher.png dist-pwa/icon-512.png
          cp /tmp/lenton-android-launcher.png dist-pwa/icon-1024.png
          sips -z 192 192 dist-pwa/icon-192.png >/dev/null
          sips -z 512 512 dist-pwa/icon-512.png >/dev/null
          sips -z 1024 1024 dist-pwa/icon-1024.png >/dev/null
          rm -f dist-pwa/lenton-official-icon.b64
          printf '%s\n' '' > dist-pwa/.nojekyll

      - name: Verify generated icon sizes
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for size in (192, 512, 1024):
              p = Path(f"dist-pwa/icon-{size}.png")
              data = p.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{p} is not PNG")
              w, h = struct.unpack(">II", data[16:24])
              if (w, h) != (size, size):
                  raise SystemExit(f"{p}: {(w,h)}")
              print(p, w, h, len(data))
          PY

      - name: Publish gh-pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pwa
          publish_branch: gh-pages
          force_orphan: true
