name: Deploy Lenton PWA

on:
  push:
    branches: [ main, pwa/android-ui-v02517 ]
    paths:
      - 'PWA/**'
      - 'LentonIOS/Resources/AppIconSource/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lenton-pwa-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check PWA/app.js
          node --check PWA/sw.js

      - name: Build static PWA
        run: |
          rm -rf dist-pwa
          cp -R PWA dist-pwa
          python3 - <<'PY'
          import base64
          from pathlib import Path
          root = Path("LentonIOS/Resources/AppIconSource")
          parts = [
              "chunk00.txt","chunk01.txt","chunk02.txt","chunk03.txt",
              "chunk04a.txt","chunk04b.txt","chunk04c.txt","chunk04d.txt","fixed04e.txt",
              "chunk05a.txt","chunk05b.txt","chunk05c.txt","chunk05d.txt","chunk05e.txt",
          ]
          encoded = "".join((root / n).read_text().strip() for n in parts)
          encoded += "=" * (-len(encoded) % 4)
          data = base64.b64decode(encoded, validate=True)
          out = Path("dist-pwa/icon-1024.png")
          out.write_bytes(data)
          print("Wrote original", out, len(data), "bytes")
          PY
          test "$(sips -g pixelWidth dist-pwa/icon-1024.png | awk '/pixelWidth/{print $2}')" = "1024"
          test "$(sips -g pixelHeight dist-pwa/icon-1024.png | awk '/pixelHeight/{print $2}')" = "1024"
          cp dist-pwa/icon-1024.png dist-pwa/icon-512.png
          cp dist-pwa/icon-1024.png dist-pwa/icon-192.png
          sips -z 512 512 dist-pwa/icon-512.png >/dev/null
          sips -z 192 192 dist-pwa/icon-192.png >/dev/null
          test "$(sips -g pixelWidth dist-pwa/icon-512.png | awk '/pixelWidth/{print $2}')" = "512"
          test "$(sips -g pixelHeight dist-pwa/icon-512.png | awk '/pixelHeight/{print $2}')" = "512"
          test "$(sips -g pixelWidth dist-pwa/icon-192.png | awk '/pixelWidth/{print $2}')" = "192"
          test "$(sips -g pixelHeight dist-pwa/icon-192.png | awk '/pixelHeight/{print $2}')" = "192"
          printf '%s\n' '' > dist-pwa/.nojekyll
          test -s dist-pwa/icon-192.png
          test -s dist-pwa/icon-512.png
          test -s dist-pwa/icon-1024.png

      - name: Publish gh-pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pwa
          publish_branch: gh-pages
          force_orphan: true
