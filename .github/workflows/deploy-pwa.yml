name: Sync Android APK and Deploy Lenton PWA

on:
  push:
    branches: [main, pwa/apk-source-pipeline-v02517, pwa/apk-renderer-v02517, pwa/android-structure-v02517, pwa/android-gestures-v02517, pwa/full-parity-v02517, pwa/ui-parity-fixes-20260919 , pwa/android-parity-pass-20260919 , pwa/android-parity-pass3-20260919 , pwa/apk-analyzer-authoritative-20260919 , pwa/post-apk-swipe-fix-20260919 , pwa/apk-runtime-parity-20260919 , pwa/fix-hidden-tabs-swipe-metadata-20260919 , pwa/real-viewpager-swipe-20260919 , pwa/emoji-media-navratio-20260919 , pwa/dm-reply-context-profile-swipe-20260919 , pwa/composer-refresh-public-dm-bubbles-20260919 , pwa/profile-pinned-thread-reply-ui-20260920 , pwa/compose-accounts-mentions-profile-parity-20260920 , pwa/settings-ui-notification-clarity-20260920 , pwa/account-settings-parity-20260920, pwa/composer-keyboard-dock-20260920, pwa/following-back-gesture-fix-20260920, pwa/dm-next-fixed-footer-20260920, pwa/foreground-push-unread-badge-20260920, pwa/background-multiaccount-badges-20260920, pwa/dm-badge-notification-click-loading-20260920]
    paths:
      - 'PWA/**'
      - 'tools/**'
      - '.github/workflows/deploy-pwa.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lenton-pwa-android-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve published Android release
        id: android
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/lenton-latest.json \
            https://raw.githubusercontent.com/cptu527/lenton-updates/main/latest.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path("/tmp/lenton-latest.json").read_text(encoding="utf-8"))
          required=("versionCode","versionName","apkUrl","sha256")
          missing=[k for k in required if not d.get(k)]
          if missing:
              raise SystemExit("latest.json missing: "+", ".join(missing))
          out=Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a",encoding="utf-8") as f:
              f.write(f"version_code={d['versionCode']}\n")
              f.write(f"version_name={d['versionName']}\n")
              f.write(f"apk_url={d['apkUrl']}\n")
              f.write(f"apk_sha={d['sha256']}\n")
          print("Android release",d["versionName"],d["versionCode"],d["sha256"])
          PY

      - name: Download exact published APK
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/lenton.apk \
            '${{ steps.android.outputs.apk_url }}'
          test -s /tmp/lenton.apk
          shasum -a 256 /tmp/lenton.apk

      - name: Install JADX
        run: |
          if ! command -v jadx >/dev/null 2>&1; then
            brew install jadx
          fi
          jadx --version

      - name: Decompile final Android APK
        run: |
          rm -rf /tmp/lenton-jadx
          set +e
          jadx --no-res --show-bad-code \
            -d /tmp/lenton-jadx \
            /tmp/lenton.apk
          JADX_EXIT=$?
          set -e
          test -d /tmp/lenton-jadx/sources
          COUNT="$(find /tmp/lenton-jadx/sources -type f -name '*.java' | wc -l | tr -d ' ')"
          echo "Decompiled Java files: $COUNT (jadx exit=$JADX_EXIT)"
          test "$COUNT" -gt 0

      - name: Generate PWA spec from final Android code
        run: |
          python3 tools/generate_pwa_spec_from_apk.py \
            --latest /tmp/lenton-latest.json \
            --apk /tmp/lenton.apk \
            --sources /tmp/lenton-jadx/sources \
            --out-js PWA/generated/android-spec.js \
            --out-json PWA/generated/android-source.json

      - name: Validate APK to PWA parity
        run: |
          python3 tools/verify_pwa_parity.py

      - name: Validate generated runtime
        run: |
          node --check PWA/generated/android-spec.js
          node --check PWA/app.js
          node --check PWA/sw.js
          node --check PWA/push/account-sw.js

      - name: Build PWA from Android release
        run: |
          rm -rf dist-pwa
          cp -R PWA dist-pwa
          python3 - <<'PY'
          import json, os, re, struct, zipfile
          from pathlib import Path

          apk=Path("/tmp/lenton.apk")
          latest=json.loads(Path("/tmp/lenton-latest.json").read_text(encoding="utf-8"))
          with zipfile.ZipFile(apk) as z:
              pngs=[]
              for n in z.namelist():
                  if not n.lower().endswith(".png") or ".9.png" in n.lower():
                      continue
                  data=z.read(n)
                  if not data.startswith(bytes([137,80,78,71,13,10,26,10])) or len(data)<24:
                      continue
                  w,h=struct.unpack(">II",data[16:24])
                  pngs.append((n,w,h,len(data)))
              candidates=[x for x in pngs if x[1]==192 and x[2]==192]
              if not candidates:
                  candidates=[x for x in pngs if x[1]==x[2] and x[1] in (48,72,96,144,192,216,324,432)]
              if not candidates:
                  raise SystemExit("No Android launcher PNG candidate found")
              launcher=sorted(candidates,key=lambda x:(x[1]==192,x[3],x[1]))[-1]
              print("Android launcher candidate",launcher)
              icon=z.read(launcher[0])
              for size in (192,512,1024):
                  Path(f"dist-pwa/icon-{size}.png").write_bytes(icon)

          revision=os.environ.get("GITHUB_SHA","")[:10] or "local"
          token=f"pwa-{revision}-android-{latest['versionCode']}-{str(latest['sha256'])[:12]}"
          index=Path("dist-pwa/index.html")
          html=index.read_text(encoding="utf-8")
          for name in ("icon-192.png","styles.css","generated/android-spec.js","app.js"):
              html=re.sub(r"\./"+re.escape(name)+r"(?:\?[^\"']*)?",f"./{name}?v={token}",html)
          index.write_text(html,encoding="utf-8")

          sw=Path("dist-pwa/sw.js")
          text=sw.read_text(encoding="utf-8")
          text=re.sub(r'const CACHE="[^"]+";',f'const CACHE="lenton-pwa-{token}";',text,count=1)
          for name in ("index.html","styles.css","app.js","manifest.webmanifest","generated/android-spec.js","changelog.json","icon-192.png","icon-512.png","icon-1024.png"):
              text=text.replace(f'"./{name}"',f'"./{name}?v={token}"')
          sw.write_text(text,encoding="utf-8")

          manifest=Path("dist-pwa/manifest.webmanifest")
          data=json.loads(manifest.read_text(encoding="utf-8"))
          for icon in data.get("icons",[]):
              src=icon.get("src","").split("?",1)[0]
              icon["src"]=f"{src}?v={token}"
          manifest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          Path("dist-pwa/build.json").write_text(json.dumps({
              "source":"published-android-apk",
              "versionCode":latest["versionCode"],
              "versionName":latest["versionName"],
              "apkSha256":latest["sha256"],
              "notes":latest.get("notes",""),
              "pwaRevision":revision,
              "cacheToken":token,
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

          cp dist-pwa/icon-192.png /tmp/lenton-icon-192.png
          cp dist-pwa/icon-512.png /tmp/lenton-icon-512.png
          cp dist-pwa/icon-1024.png /tmp/lenton-icon-1024.png
          sips -z 192 192 /tmp/lenton-icon-192.png --out dist-pwa/icon-192.png >/dev/null
          sips -z 512 512 /tmp/lenton-icon-512.png --out dist-pwa/icon-512.png >/dev/null
          sips -z 1024 1024 /tmp/lenton-icon-1024.png --out dist-pwa/icon-1024.png >/dev/null
          printf '%s\n' '' > dist-pwa/.nojekyll

      - name: Verify PWA follows Android version
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          latest=json.loads(Path("/tmp/lenton-latest.json").read_text(encoding="utf-8"))
          generated=json.loads(Path("PWA/generated/android-source.json").read_text(encoding="utf-8"))
          built=json.loads(Path("dist-pwa/build.json").read_text(encoding="utf-8"))
          if int(generated["versionCode"]) != int(latest["versionCode"]):
              raise SystemExit("generated PWA versionCode does not match Android")
          if str(generated["apkSha256"]).lower() != str(latest["sha256"]).lower():
              raise SystemExit("generated PWA APK SHA does not match Android")
          if built["versionName"] != latest["versionName"]:
              raise SystemExit("built PWA versionName does not match Android")
          for size in (192,512,1024):
              p=Path(f"dist-pwa/icon-{size}.png")
              data=p.read_bytes()
              if data[:8] != bytes([137,80,78,71,13,10,26,10]):
                  raise SystemExit(f"{p} is not PNG")
              w,h=struct.unpack(">II",data[16:24])
              if (w,h)!=(size,size):
                  raise SystemExit(f"{p}: {(w,h)}")
          print("PWA verified against Android",latest["versionName"],latest["versionCode"])
          PY

      - name: Persist generated Android spec
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- PWA/generated; then
            echo "Generated Android spec is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PWA/generated/android-spec.js PWA/generated/android-source.json
          git commit -m "Sync PWA spec from Android v${{ steps.android.outputs.version_name }}"
          git push origin HEAD:main

      - name: Publish gh-pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pwa
          publish_branch: gh-pages
          force_orphan: true
