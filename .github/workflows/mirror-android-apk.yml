name: Mirror Android APK to Pages

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/mirror-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Download current Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages/android-updates
          curl -fL --retry 4 --retry-delay 2 --retry-all-errors \
            -o pages/android-updates/Lenton-v0.27.03-test.apk \
            https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.27.03-test.apk
          test -s pages/android-updates/Lenton-v0.27.03-test.apk
          sha256sum pages/android-updates/Lenton-v0.27.03-test.apk

      - name: Publish mirror to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-updates/Lenton-v0.27.03-test.apk
          if git diff --cached --quiet; then
            echo "Mirror is already current"
            exit 0
          fi
          git commit -m "Mirror Lenton v0.27.03 APK"
          git push origin HEAD:gh-pages
